name: Cart checkout isolated validation
on:
  push:
    branches: [validation/cart-checkout-final-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch original vector glyphs and license for inspection
        run: |
          mkdir -p /tmp/artisan-wordmark
          curl -fsSL https://raw.githubusercontent.com/AlexanderPoellmann/PaymentFont/master/fonts/paymentfont-webfont.svg -o /tmp/artisan-wordmark/paymentfont.svg
          curl -fsSL https://raw.githubusercontent.com/AlexanderPoellmann/PaymentFont/master/LICENSE -o /tmp/artisan-wordmark/LICENSE.txt
          curl -fsSL https://raw.githubusercontent.com/AlexanderPoellmann/PaymentFont/master/css/paymentfont.css -o /tmp/artisan-wordmark/mapping.css
      - uses: actions/upload-artifact@v4
        with:
          name: artisan-wordmark
          path: /tmp/artisan-wordmark
          retention-days: 1
