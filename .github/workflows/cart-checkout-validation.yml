name: Cart checkout isolated validation
on:
  push:
    branches: [validation/cart-checkout-final-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch original payment badge paths and license
        run: |
          mkdir -p /tmp/artisan-badges
          for brand in visa mastercard amex; do
            curl -fsSL "https://raw.githubusercontent.com/medipass/react-payment-inputs/master/src/images/$brand.js" -o "/tmp/artisan-badges/$brand.js"
          done
          curl -fsSL https://raw.githubusercontent.com/medipass/react-payment-inputs/master/LICENSE -o /tmp/artisan-badges/LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: artisan-badges
          path: /tmp/artisan-badges
          retention-days: 1
