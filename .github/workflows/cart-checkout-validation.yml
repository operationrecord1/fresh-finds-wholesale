name: Cart checkout isolated validation
on:
  push:
    branches: [validation/cart-checkout-final-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d6e24188dca6e22d78dbdc34b2d073bd6c08f4e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: TypeScript and regression tests
        run: |
          bunx tsc --noEmit
          bun run test
      - name: Netlify production build
        run: bun run build:netlify
      - name: Prepare live browser verification
        run: |
          npm install --prefix /tmp/artisan-live --no-save playwright
          mkdir -p /tmp/artisan-live/results
          if ! command -v google-chrome; then /tmp/artisan-live/node_modules/.bin/playwright install --with-deps chromium; fi
      - name: Check fresh live Cart and Checkout
        run: |
          cat > /tmp/artisan-live/check.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const cp=require('node:child_process');
          (async()=>{
            let exe;try{exe=cp.execSync('which google-chrome').toString().trim()}catch{}
            const browser=await chromium.launch({headless:true,...(exe?{executablePath:exe}:{})});
            const results=[];
            try {
              for(const width of [1440,390,320]) for(const route of ['cart','checkout']){
                const context=await browser.newContext({viewport:{width,height:1000},deviceScaleFactor:width<500?3:1});
                await context.addInitScript(()=>sessionStorage.setItem('artisan-mart-cart',JSON.stringify([{sku:'DA883',pieces:40,mode:'piece'}])));
                const page=await context.newPage();
                const response=await page.goto('https://artisanmart.site/'+route+'?verify=2d6e241',{waitUntil:'networkidle',timeout:60000});
                assert.equal(response.status(),200);
                const field=page.getByRole('textbox',{name:route==='cart'?'Promo code':'Coupon code',exact:true});
                await field.waitFor();
                const slot=page.getByTestId('coupon-feedback-slot');
                const next=route==='cart'?page.getByRole('combobox',{name:'Sales representative',exact:true}):page.getByPlaceholder('Comments');
                const before=await next.boundingBox();
                await page.clock.install();
                await field.fill('WRONG');await page.getByRole('button',{name:'Apply',exact:true}).click();
                await page.getByRole('alert').waitFor();
                const measurement=await slot.evaluate(el=>{const p=el.querySelector('p'),c=getComputedStyle(el),t=getComputedStyle(p);return {height:el.getBoundingClientRect().height,paddingTop:c.paddingTop,paddingBottom:c.paddingBottom,fontSize:t.fontSize,lineHeight:t.lineHeight,text:p.textContent,color:t.color}});
                const row=await field.evaluate(el=>{const r=el.parentElement.getBoundingClientRect();return {bottom:r.bottom}});
                const after=await next.boundingBox();
                assert.equal(after.y-row.bottom,15);assert.equal(before.y,after.y);
                assert.equal(measurement.height,15);assert.equal(measurement.fontSize,'10px');assert.equal(measurement.lineHeight,'10px');assert.equal(measurement.paddingTop,'2.5px');assert.equal(measurement.paddingBottom,'2.5px');
                await page.screenshot({path:'/tmp/artisan-live/results/'+route+'-'+width+'.png',fullPage:true});
                await page.clock.runFor(10000);
                await field.fill('WRONG_AGAIN');await page.getByRole('button',{name:'Apply',exact:true}).click();
                await page.clock.runFor(19999);assert.equal(await page.getByRole('alert').count(),1);
                await page.clock.runFor(1);await page.getByRole('alert').waitFor({state:'detached'});
                await page.getByRole('button',{name:'Apply',exact:true}).click();await page.getByRole('alert').waitFor();
                await field.fill('ARTISAN');await page.getByRole('button',{name:'Apply',exact:true}).click();
                assert.equal(await page.getByRole('alert').count(),0);
                await page.clock.runFor(20000);assert.match(await page.getByRole('status').textContent(),/No discount has been applied/);
                let logos=null;
                if(route==='checkout'){
                  await page.getByLabel('Card number',{exact:true}).fill('4000000000000000006');
                  logos=await page.locator('.payment-number-field').evaluate(el=>{
                    const input=el.querySelector('input'),r=input.getBoundingClientRect(),g=el.querySelector('.payment-number-brands').getBoundingClientRect();
                    return {inside:g.x>=r.x&&g.right<=r.right&&g.y>=r.y&&g.bottom<=r.bottom,paddingSafe:r.right-parseFloat(getComputedStyle(input).paddingRight)<=g.x,white:getComputedStyle(input).backgroundColor,images:[...el.querySelectorAll('img')].map(i=>({alt:i.alt,loaded:i.complete&&i.naturalWidth>0,svg:i.src.endsWith('.svg')}))};
                  });
                  assert(logos.inside&&logos.paddingSafe);assert.equal(logos.white,'rgb(255, 255, 255)');assert.deepEqual(logos.images.map(i=>i.alt),['Visa','Mastercard','American Express']);assert(logos.images.every(i=>i.loaded&&i.svg));
                  await page.locator('.payment-number-field').screenshot({path:'/tmp/artisan-live/results/logos-'+width+'.png'});
                }
                results.push({route,width,httpStatus:response.status(),server:(await response.allHeaders()).server,measurement,gap:after.y-row.bottom,layoutShift:after.y-before.y,timerRestart:true,validCancelsError:true,logos});
                fs.writeFileSync('/tmp/artisan-live/results/live-verification.json',JSON.stringify(results,null,2));
                console.log('LIVE_PASS',route,width,JSON.stringify(results.at(-1)));
                await context.close();
              }
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node /tmp/artisan-live/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artisan-live-verification
          path: /tmp/artisan-live/results
          retention-days: 1
