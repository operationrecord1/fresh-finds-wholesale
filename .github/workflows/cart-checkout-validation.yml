name: Cart checkout isolated validation
on:
  push:
    branches: [validation/cart-checkout-final-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Prepare offline validation dependencies and vector candidates
        run: |
          mkdir -p /tmp/artisan-validation/assets
          tar -czf /tmp/artisan-validation/node_modules.tgz node_modules
          for brand in visa mastercard amex; do
            curl --retry 1 -fsSL "https://www.gstatic.com/instantbuy/svg/$brand.svg" -o "/tmp/artisan-validation/assets/google-$brand.svg" || true
            curl --retry 1 -fsSL "https://raw.githubusercontent.com/woocommerce/woocommerce-gateway-stripe/develop/assets/images/$brand.svg" -o "/tmp/artisan-validation/assets/woo-$brand.svg" || true
          done
          curl --retry 1 -fsSL https://raw.githubusercontent.com/paymentfont/PaymentFont/master/fonts/paymentfont-webfont.svg -o /tmp/artisan-validation/assets/paymentfont.svg || true
          ls -lh /tmp/artisan-validation /tmp/artisan-validation/assets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artisan-validation-tools
          path: /tmp/artisan-validation
          retention-days: 1
