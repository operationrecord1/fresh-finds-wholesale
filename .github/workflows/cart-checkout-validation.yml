name: Cart checkout isolated validation
on:
  push:
    branches: [validation/cart-checkout-final-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect legacy vector badge shapes
        run: |
          mkdir -p /tmp/legacy-card /tmp/legacy-source
          curl -fsSL https://codeload.github.com/medipass/react-credit-card-input/tar.gz/refs/heads/master -o /tmp/legacy-source/source.tgz
          tar -xzf /tmp/legacy-source/source.tgz -C /tmp/legacy-source
          cp -r /tmp/legacy-source/react-credit-card-input-master/src /tmp/legacy-card/src
          find /tmp/legacy-source/react-credit-card-input-master -maxdepth 1 -iname '*licen*' -exec cp {} /tmp/legacy-card/ \;
          curl -fsSL https://raw.githubusercontent.com/medipass/react-payment-inputs/master/package.json -o /tmp/legacy-card/package-source.json
          curl -fsSL https://raw.githubusercontent.com/medipass/react-payment-inputs/master/LICENSE.md -o /tmp/legacy-card/payment-inputs-LICENSE.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artisan-legacy-vectors
          path: /tmp/legacy-card
          retention-days: 1
