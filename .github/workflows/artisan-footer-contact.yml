name: Artisan Footer and Contact Acceptance
on:
  push:
    branches: [main]
    paths:
      - src/components/store/SiteFooter.tsx
      - src/components/store/SiteFooter.css
      - src/components/store/AboutPage.css
      - src/components/store/TermsPage.css
      - src/components/store/ContactPage.css
      - src/routes/contact.tsx
      - src/routes/terms-of-sale.tsx
      - src/routes/privacy.tsx
      - scripts/footer-contact-qa.cjs
      - workers/contact.js
      - workers/contact.test.js
      - .github/workflows/artisan-footer-contact.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: node --test workers/contact.test.js
      - run: bunx tsc --noEmit
      - run: bun run build:cloudflare
      - name: Install isolated browser
        run: |
          npm install --prefix /tmp/artisan-footer-browser --no-save --ignore-scripts playwright@1.56.1
          /tmp/artisan-footer-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check local rendered pages
        env:
          NODE_PATH: /tmp/artisan-footer-browser/node_modules
          ARTISAN_QA_SERVE: '1'
        run: node scripts/footer-contact-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footer-contact-local-screenshots
          path: footer-contact-qa/
  production-browser:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix /tmp/artisan-footer-browser --no-save --ignore-scripts playwright@1.56.1
          /tmp/artisan-footer-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: sleep 90
      - name: Check live rendered pages
        env:
          NODE_PATH: /tmp/artisan-footer-browser/node_modules
          ARTISAN_FOOTER_URL: https://artisanmart.site
        run: node scripts/footer-contact-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footer-contact-live-screenshots
          path: footer-contact-qa/
