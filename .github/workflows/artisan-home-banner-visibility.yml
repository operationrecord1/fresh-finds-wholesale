name: Artisan Homepage Banner Visibility
on:
  push:
    branches: [fix/artisan-home-banner-visibility-20261127, fix/artisan-home-heading-two-lines-20261127, fix/artisan-home-spacing-auto-carousel-20261127, main]
    paths:
      - src/styles.css
      - src/routes/index.tsx
      - src/components/store/HeroCarousel.tsx
      - src/components/store/HeroCarousel.css
      - src/test/hero-banner.test.tsx
      - scripts/artisan-home-banner-qa.cjs
      - .github/workflows/artisan-home-banner-visibility.yml
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bunx tsc --noEmit
      - run: bun run build:cloudflare
      - run: node --check scripts/artisan-home-banner-qa.cjs
      - name: Verify built homepage at all requested widths before merge
        run: |
          npm install --prefix /tmp/artisan-banner-browser --no-save --ignore-scripts playwright@1.56.1
          /tmp/artisan-banner-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/client >/tmp/artisan-banner-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node scripts/artisan-home-banner-qa.cjs
        env:
          NODE_PATH: /tmp/artisan-banner-browser/node_modules
          ARTISAN_BANNER_URL: http://127.0.0.1:8765
  production-browser:
    if: github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/artisan-banner-browser --no-save --ignore-scripts playwright@1.56.1
          /tmp/artisan-banner-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: sleep 90
      - run: node scripts/artisan-home-banner-qa.cjs
        env:
          NODE_PATH: /tmp/artisan-banner-browser/node_modules
          ARTISAN_BANNER_URL: https://artisanmart.site
