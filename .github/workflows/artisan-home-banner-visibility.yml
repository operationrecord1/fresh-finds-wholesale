name: Artisan Homepage Banner Visibility
on:
  push:
    branches: [fix/artisan-home-banner-visibility-20261127, main]
    paths:
      - src/styles.css
      - scripts/artisan-home-banner-qa.cjs
      - .github/workflows/artisan-home-banner-visibility.yml
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bunx tsc --noEmit
      - run: bun run build:cloudflare
      - run: node --check scripts/artisan-home-banner-qa.cjs
  production-browser:
    if: github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/artisan-banner-browser --no-save --ignore-scripts playwright@1.56.1
          /tmp/artisan-banner-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: sleep 90
      - run: node scripts/artisan-home-banner-qa.cjs
        env:
          NODE_PATH: /tmp/artisan-banner-browser/node_modules
          ARTISAN_BANNER_URL: https://artisanmart.site
