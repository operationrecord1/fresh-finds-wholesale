name: Update Supabase dependency lockfile (development only)
on:
  push:
    branches: [development/supabase-backend-20261125]
    paths: [package.json]
permissions:
  contents: write
concurrency:
  group: artisan-supabase-lockfile
  cancel-in-progress: false
jobs:
  lock:
    if: github.ref == 'refs/heads/development/supabase-backend-20261125'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/supabase-backend-20261125
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Rebuild exact dependency lockfile
        run: |
          bun install
          git diff --check
      - name: Commit lockfile only
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "Lock exact Supabase SDK dependency for isolated backend branch"
            git push origin HEAD:development/supabase-backend-20261125
          fi
