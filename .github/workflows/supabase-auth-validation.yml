name: Artisan Supabase Auth and Build Validation
on:
  push:
    branches: [development/supabase-backend-20261125]
    paths:
      - src/lib/artisan-auth.tsx
      - src/components/store/AccountForm.tsx
      - src/components/store/SiteHeader.tsx
      - src/routes/account.tsx
      - src/routes/reset-password.tsx
      - src/routes/__root.tsx
      - src/routes/checkout.tsx
      - src/routes/order-confirmation.tsx
      - src/routes/cart.tsx
      - src/lib/cart.tsx
      - src/lib/artisan-checkout-intent.ts
      - src/test/checkout-flow.test.tsx
      - src/test/artisan-customer-header.test.tsx
      - src/lib/artisan-live-catalog.ts
      - package.json
      - bun.lock
      - .github/workflows/supabase-auth-validation.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: artisan-supabase-auth-validation
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Verify exact dependencies
        run: bun install --frozen-lockfile
      - name: Run existing and new unit tests
        run: bun run test
      - name: Build isolated Cloudflare SPA and regenerate TanStack route types
        run: bun run build:cloudflare
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Commit generated route types on development branch
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "Regenerate typed customer account routes on development branch"
            git fetch origin development/supabase-backend-20261125
            git rebase origin/development/supabase-backend-20261125
            git push origin HEAD:development/supabase-backend-20261125
          fi
