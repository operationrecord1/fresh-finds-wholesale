name: Scoped storefront validation
on:
  push:
    branches: [validation/storefront-scope-20261117]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore checksum-verified proposed changes
        run: |
          mkdir -p /tmp/artisan-results /tmp/artisan-browser
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          original_tail = ''
          encoded = base64.b64encode(pathlib.Path('.github/validation/scoped-payload.gz').read_bytes()).decode()
          payload = base64.b64decode(encoded[:14156] + original_tail)
          actual = hashlib.sha1(b'blob ' + str(len(payload)).encode() + b'\0' + payload).hexdigest()
          assert actual == '6bb965d5622133454e7834415905bba2533bf3c4', actual
          data = json.loads(gzip.decompress(payload))
          pathlib.Path('/tmp/scoped-payload.json').write_text(json.dumps(data))
          pathlib.Path('/tmp/scoped.patch').write_text(data['patch'])
          pathlib.Path('/tmp/artisan-browser/check.cjs').write_text(data['browser'])
          print('Validated proposal transport checksum')
          PY
          git fetch origin 2d6e24188dca6e22d78dbdc34b2d073bd6c08f4e
          git checkout --detach 2d6e24188dca6e22d78dbdc34b2d073bd6c08f4e
          git apply --check /tmp/scoped.patch
          git apply /tmp/scoped.patch
          git diff --check
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Regression tests
        run: bun run test --maxWorkers=2
      - name: Netlify production build
        run: bun run build:netlify
      - name: Desktop and mobile browser checks
        run: |
          npm install --prefix /tmp/artisan-browser --no-save playwright
          if ! command -v google-chrome; then /tmp/artisan-browser/node_modules/.bin/playwright install --with-deps chromium; fi
          node /tmp/artisan-browser/check.cjs
      - name: Create validated commit without updating production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, hashlib, pathlib, os, urllib.request, subprocess
          repo='operationrecord1/fresh-finds-wholesale'
          base='2d6e24188dca6e22d78dbdc34b2d073bd6c08f4e'
          data=json.loads(pathlib.Path('/tmp/scoped-payload.json').read_text())
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()+subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed==set(data['manifest']), changed
          entries=[]
          for filename, expected in data['manifest'].items():
            b=pathlib.Path(filename).read_bytes()
            assert hashlib.sha256(b).hexdigest()==expected, filename
            entries.append({'path':filename,'mode':'100644','type':'blob','content':b.decode()})
          def api(endpoint,body=None):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+endpoint, data=json.dumps(body).encode() if body is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req) as response:return json.load(response)
          assert api('/branches/main')['commit']['sha']==base,'Production branch changed'
          tree=api('/git/trees',{'base_tree':'3d7f3f840202e9ade7caffc9bdcb3df394026c1d','tree':entries})
          commit=api('/git/commits',{'message':'Apply approved promotion, naming, stock limits and Sales FAQ fixes','tree':tree['sha'],'parents':[base]})
          result={'commit':commit['sha'],'tree':tree['sha'],'base':base,'files':data['manifest'],'mainUpdated':False}
          pathlib.Path('/tmp/artisan-results/candidate.json').write_text(json.dumps(result,indent=2))
          print('VALIDATED_CANDIDATE',commit['sha'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artisan-scoped-validation
          path: /tmp/artisan-results
          retention-days: 1
