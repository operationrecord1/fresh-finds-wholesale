name: Scoped storefront live verification
on:
  push:
    branches: [validation/storefront-scope-20261117]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare independent browser
        run: |
          mkdir -p /tmp/artisan-browser /tmp/artisan-results
          cp .github/validation/scoped-live-check.cjs /tmp/artisan-browser/check.cjs
          npm install --prefix /tmp/artisan-browser --no-save playwright
          if ! command -v google-chrome; then /tmp/artisan-browser/node_modules/.bin/playwright install --with-deps chromium; fi
      - name: Verify published Netlify and live storefront
        run: node /tmp/artisan-browser/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artisan-scoped-live-verification
          path: /tmp/artisan-results
          retention-days: 1
